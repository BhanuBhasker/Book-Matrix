# Test profile: a SEPARATE database that is wiped before every test. Never point this at real data.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/bookmatrix_test?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.hikari.maximum-pool-size=20
bookmatrix.bcrypt-strength=4
bookmatrix.backup-dir=target/test-backups
bookmatrix.admin.email=
bookmatrix.admin.password=
logging.level.com.bookmatrix=WARN
logging.level.org.springframework=WARN
