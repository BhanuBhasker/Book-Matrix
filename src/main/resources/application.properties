# =====================================================================
# BookMatrix configuration.
# Secrets are NEVER written here. They come from environment variables
# or from a local, git-ignored ".env" file (see .env.example).
# =====================================================================
spring.application.name=BookMatrix
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# ---- Database (MySQL via JDBC, pooled by HikariCP) -------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/bookmatrix_dev?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:bookmatrix}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.pool-name=BookMatrixPool
spring.datasource.hikari.maximum-pool-size=10
# fail fast (4s) when MySQL is down instead of hanging the request
spring.datasource.hikari.connection-timeout=4000
# let the app start even if MySQL is down; requests then get a clean 503
spring.datasource.hikari.initialization-fail-timeout=-1

# ---- Sessions & cookies ----------------------------------------------
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=BMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---- Errors: never leak stack traces or internals --------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# ---- Uploads (CSV import) --------------------------------------------
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

# ---- BookMatrix business settings ------------------------------------
bookmatrix.max-tickets-per-booking=10
bookmatrix.cancellation-cutoff-hours=2
# minutes a customer has to pay before held tickets/seats are released
bookmatrix.payment-hold-minutes=10
bookmatrix.bcrypt-strength=10
bookmatrix.backup-dir=${BACKUP_DIR:backups}
# First administrator (only used when no admin exists yet)
bookmatrix.admin.name=${BOOKMATRIX_ADMIN_NAME:}
bookmatrix.admin.email=${BOOKMATRIX_ADMIN_EMAIL:}
bookmatrix.admin.password=${BOOKMATRIX_ADMIN_PASSWORD:}

logging.level.root=INFO
logging.level.com.bookmatrix=INFO
logging.level.com.zaxxer.hikari=WARN

# ---- Static files: always serve the latest UI ------------------------
# The jar stamps every file with the same date (1980), so browsers would keep
# showing old CSS/JS forever. Make them re-download static files every time.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-store=true
