<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — BookMatrix</title>
  <meta name="description" content="BookMatrix: discover events and book tickets.">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css?v=2026112505">
  <script type="module" src="/js/pages/login.js?v=2026112505"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="auth-wrap">
      <div class="panel">
        <h1>Log in</h1>
        <p class="muted">Welcome back. Log in to book and manage your tickets.</p>
        <div id="login-notice"></div>
        <form id="login-form" novalidate>
          <div class="alert alert-error form-alert" role="alert" hidden></div>
          <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
          <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required></div>
          <button class="btn btn-block" type="submit">Log in</button>
        </form>
        <p class="small muted" style="margin:16px 0 0">New to BookMatrix? <a href="/register.html">Create an account</a></p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
