<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events — BookMatrix</title>
  <meta name="description" content="BookMatrix: discover events and book tickets.">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css?v=2026112505">
  <script type="module" src="/js/pages/events.js?v=2026112505"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="container">
      <div class="page-head spread">
        <div><p class="eyebrow">Discover</p><h1>All events</h1></div>
        <button class="btn btn-secondary filters-toggle" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
      </div>
      <div class="discover">
        <form class="filters" id="filters" aria-label="Filter events">
          <h2>Refine</h2>
          <div class="field"><label for="f-q">Search</label><input class="input" id="f-q" name="q" type="search" maxlength="100" placeholder="Name, venue, city"></div>
          <div class="field"><label for="f-category">Category</label><select class="input" id="f-category" name="category"><option value="">All categories</option></select></div>
          <div class="field"><label for="f-city">City</label><select class="input" id="f-city" name="city"><option value="">Any city</option></select></div>
          <div class="field"><label for="f-status">Show</label>
            <select class="input" id="f-status" name="status">
              <option value="UPCOMING">Upcoming (incl. sold out)</option>
              <option value="AVAILABLE">Tickets available</option>
              <option value="SOLD_OUT">Sold out</option>
              <option value="LIVE">Happening now</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
              <option value="ALL">Everything</option>
            </select></div>
          <div class="field"><label for="f-from">From date</label><input class="input" id="f-from" name="from" type="date"></div>
          <div class="field"><label for="f-to">To date</label><input class="input" id="f-to" name="to" type="date"></div>
          <div class="field"><span class="label">Price (₹)</span>
            <div class="two"><input class="input" name="minPrice" type="number" min="0" step="1" placeholder="Min" aria-label="Minimum price">
            <input class="input" name="maxPrice" type="number" min="0" step="1" placeholder="Max" aria-label="Maximum price"></div></div>
          <div class="field"><label for="f-sort">Sort by</label>
            <select class="input" id="f-sort" name="sort">
              <option value="DATE_ASC">Date: soonest first</option>
              <option value="DATE_DESC">Date: latest first</option>
              <option value="PRICE_ASC">Price: low to high</option>
              <option value="PRICE_DESC">Price: high to low</option>
              <option value="POPULAR">Most booked</option>
            </select></div>
          <button class="btn btn-secondary btn-block" type="reset">Clear filters</button>
        </form>
        <section aria-live="polite">
          <div class="chips quick-dates" id="quick-dates" role="group" aria-label="Quick date filters"></div>
          <div class="results-head">
            <p class="muted" id="result-count" style="margin:0" aria-live="polite"></p>
            <div class="active-filters" id="active-filters" aria-label="Active filters"></div>
          </div>
          <div id="results"></div>
          <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
        </section>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
