<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events — BookMatrix Admin</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css?v=2026112505">
  <script type="module" src="/js/admin/events.js?v=2026112505"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <div class="admin-shell">
    <aside class="admin-side" id="admin-side" aria-label="Admin navigation"></aside>
    <main id="main" class="admin-main" tabindex="-1">
      <div class="page-title"><div><p class="eyebrow">Manage</p><h1>Events</h1></div><a class="btn" href="/admin/event-form.html">New event</a></div>
      <form class="toolbar" id="toolbar" role="search">
        <label class="visually-hidden" for="a-q">Search</label><input class="input" id="a-q" name="q" type="search" maxlength="100" placeholder="Search title, venue, city">
        <label class="visually-hidden" for="a-status">Status</label>
        <select class="input" id="a-status" name="status">
          <option value="ALL">All statuses</option><option value="UPCOMING">Upcoming</option><option value="SOLD_OUT">Sold out</option>
          <option value="LIVE">Live</option><option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option>
        </select>
        <label class="visually-hidden" for="a-cat">Category</label><select class="input" id="a-cat" name="category"><option value="">All categories</option></select>
        <label class="visually-hidden" for="a-arch">Archive</label>
        <select class="input" id="a-arch" name="archived"><option value="EXCLUDE">Active only</option><option value="ONLY">Archived only</option><option value="INCLUDE">Active + archived</option></select>
      </form>
      <div id="table"></div>
      <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
    </main>
  </div>
</body>
</html>
